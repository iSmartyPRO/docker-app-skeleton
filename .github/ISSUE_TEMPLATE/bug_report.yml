name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** See [SECURITY.md](https://github.com/iSmartyPRO/docker-app-skeleton/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /admin/settings/…
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the `VERSION` file, the footer, or `GET /health`.
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options:
        - Production container (make up)
        - Development stack (make dev)
        - Host Node.js
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `make logs` and the browser console. Remove secrets.
      render: shell
