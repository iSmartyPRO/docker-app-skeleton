name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend checks & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/backend/package-lock.json
            src/frontend/package-lock.json
      - run: npm ci
      # Backend tests import shared frontend modules (readme, tours, i18n, …) and their packages.
      - name: Frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: src/frontend
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
        env:
          UPLOAD_DIR: ${{ runner.temp }}/uploads
