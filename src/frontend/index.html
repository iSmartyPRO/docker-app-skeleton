<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Application console" />
    <!-- Tab icon: the API redirects to the app icon from settings (or /favicon.svg),
         and the app swaps in the direct URL once settings load (pwa/appIcon.js). -->
    <link rel="icon" href="/api/pwa/icon" />
    <!-- Installable app (PWA): manifest is built from settings by the API. -->
    <link rel="manifest" href="/api/pwa/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#1E3A6E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portal" />
    <meta name="format-detection" content="telephone=no" />
    <title>docker-app-skeleton</title>
    <!-- The selected typeface is injected at runtime by FontLoader. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
