events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    # Alpine's mime.types has no .mjs: pdf.js loads its worker as an ES module,
    # and with nosniff an octet-stream response is refused by the browser.
    types {
        text/javascript mjs;
        font/ttf ttf;
    }
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    upstream backend {
        server localhost:3001;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location ~ /\. {
            deny all;
            return 404;
        }

        # Vite emits content-hashed bundles: cache them forever.
        location /assets/ {
            root /app/frontend/dist;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Service worker of the installed app (PWA): never cached, so updates reach phones at once.
        location = /sw.js {
            root /app/frontend/dist;
            add_header Cache-Control "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # There is no favicon.ico file: without this the SPA fallback answered
        # it with index.html. The API redirects to the configured app icon
        # (or the bundled /favicon.svg) with no-cache, so a new icon shows up
        # for clients that ask for /favicon.ico directly.
        location = /favicon.ico {
            proxy_pass http://backend/api/pwa/icon;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # index.html must always be revalidated so new deploys are picked up.
        location / {
            root /app/frontend/dist;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            try_files $uri $uri/ /index.html;
        }

        # Drive streams files to and from company file servers: big uploads,
        # long downloads and ZIP archives that must not be buffered.
        location ~ ^/api(/v1)?/app/drive(/|$) {
            client_max_body_size 10g;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat live events (Server-Sent Events): never buffered, kept open.
        location ~ ^/api(/v1)?/app/chat/stream$ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/d/ {
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Module APIs (also under /api/v1 for integrations) accept large uploads (the per-module limit lives in its settings)
        # and may wait on document conversion, so they stream and time out later.
        location /api/app/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/app/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'none'; script-src 'none'" always;
        }

        location /health {
            proxy_pass http://backend/health;
        }

        location /ready {
            proxy_pass http://backend/ready;
        }
    }
}
